{% set version = "2.50-2" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-liblinear
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/LiblineaR_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/LiblineaR/LiblineaR_{{ version }}.tar.gz
  sha256: a3229f43ac0fe475b5ee8d088d1542afdc979c109c480637b88f6e7d955655fe

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - cross-r-base {{ r_base }}  # [build_platform != target_platform]
    - {{ compiler('c') }}              # [not win]
    - {{ stdlib("c") }}                # [not win]
    - {{ compiler('m2w64_c') }}        # [win]
    - {{ stdlib("m2w64_c") }}          # [win]
    - {{ compiler('cxx') }}            # [not win]
    - {{ compiler('m2w64_cxx') }}      # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('LiblineaR')"           # [not win]
    - "\"%R%\" -e \"library('LiblineaR')\""  # [win]

about:
  home: https://cran.r-project.org/web/packages/LiblineaR/index.html
  license: GPL-2.0-only
  summary: A wrapper around the LIBLINEAR C/C++ library for machine learning.
  license_family: GPL2
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2

extra:
  recipe-maintainers:
    - conda-forge/r
    - MathiasHaudgaard
    - FrodePedersen
    - ArneKr
